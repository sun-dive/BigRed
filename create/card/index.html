<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Card maker · nft.gift</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='84'>🎁</text></svg>">
<style>
  :root{--bg:#0d1117;--panel:#161b22;--panel2:#1f2530;--line:#2b303b;--ink:#e7e9ee;--dim:#9aa1af;--accent:#8b7cf6;--accent2:#5eead4;--font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--radius:8px}
  *{box-sizing:border-box} html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);display:flex;flex-direction:column;overflow:hidden;touch-action:none}
  .appnav{display:flex;align-items:center;gap:14px;padding:9px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .appnav .brand{font-weight:750;color:var(--ink);text-decoration:none;font-size:15px} .appnav .brand b{color:var(--accent)}
  .appnav .tabs{display:flex;gap:6px;margin-left:auto}
  .appnav .tab{padding:6px 12px;border-radius:8px;color:var(--dim);text-decoration:none;font-size:13px;border:1px solid transparent}
  .appnav .tab:hover{color:var(--ink);background:var(--panel2)}
  .appnav .tab.on{color:#fff;background:color-mix(in srgb,var(--accent) 22%,var(--panel2));border-color:var(--accent)}
  .toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:9px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  .group{display:flex;align-items:center;gap:6px}
  .group .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin-right:2px}
  .sep{width:1px;align-self:stretch;background:var(--line);margin:2px}
  .stat{font:12px/1.4 ui-monospace,Menlo,monospace;color:var(--dim);margin-left:auto}
  .stat b{color:var(--ink)} .stat .seal{color:var(--accent2)} .stat .price b{color:var(--accent2)}
  button.tool,select,button.act{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);padding:7px 9px;font-size:14px;cursor:pointer;line-height:1}
  button.tool{min-width:36px}
  button.tool.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 22%,var(--panel2));color:#fff}
  button.act{font-weight:600;font-size:13px} button.act.primary{background:var(--accent);border-color:var(--accent);color:#0b0b12}
  button.act.pay{background:var(--accent2);border-color:var(--accent2);color:#07120f}
  button:disabled{opacity:.4;cursor:not-allowed}
  .swatch{width:24px;height:24px;border-radius:50%;border:2px solid rgba(255,255,255,.15);cursor:pointer;padding:0}
  .swatch.on{border-color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
  .width{width:34px;height:34px;display:grid;place-items:center;border-radius:var(--radius);background:var(--panel2);border:1px solid var(--line);cursor:pointer}
  .width.on{border-color:var(--accent)} .width i{display:block;background:var(--ink);border-radius:99px}
  input[type=color]{-webkit-appearance:none;appearance:none;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;padding:0;background:none;cursor:pointer}
  input[type=color]::-webkit-color-swatch-wrapper{padding:2px} input[type=color]::-webkit-color-swatch{border:none;border-radius:6px} input[type=color]::-moz-color-swatch{border:none;border-radius:6px}
  #hex{width:92px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:13px ui-monospace,Menlo,monospace;text-transform:uppercase}
  .tpanel{position:absolute;top:calc(100% + 8px);left:0;z-index:30;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:11px;box-shadow:0 14px 34px rgba(0,0,0,.55);min-width:216px}
  .tpanel[hidden]{display:none}
  .tpanel label{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim)}
  .tpanel label .v{margin-left:auto;color:var(--ink);font:12px ui-monospace,Menlo,monospace}
  .tpanel input[type=range]{flex:1;accent-color:var(--accent)} .tpanel .chk{gap:7px}
  .stage{flex:1;display:flex;align-items:center;justify-content:center;padding:18px;min-height:0}
  .frame{position:relative;aspect-ratio:3/4;height:min(80vh,120vw);border-radius:14px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5),0 0 0 1px var(--line)}
  svg{display:block;width:100%;height:100%;cursor:crosshair;touch-action:none}
  svg.pan{cursor:grab}
  .hint{position:absolute;left:12px;bottom:10px;font-size:11px;color:rgba(255,255,255,.55);background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px;pointer-events:none;backdrop-filter:blur(2px)}
  .drawer{max-height:0;overflow:hidden;transition:max-height .2s ease;background:var(--panel);border-top:1px solid var(--line)}
  .drawer.open{max-height:38vh;overflow:auto}
  .drawer pre{margin:0;padding:14px 16px;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--dim);white-space:pre-wrap;word-break:break-all}
  .drawer pre .g{color:var(--accent2)}
  footer{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 16px;border-top:1px solid var(--line);background:var(--panel)}
  .ledger{display:flex;align-items:center;gap:6px;flex:1;min-width:140px;overflow:auto;font:12px ui-monospace,Menlo,monospace}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .chip i{width:9px;height:9px;border-radius:50%} .spacer{flex:1}
  @media (max-width:640px){.appnav .brand span{display:none}}
  /* ── App SKINS (the whole-tool vibe; separate from the canvas art themes) ── */
  body[data-skin="crayon"]{--bg:#efe4cd;--panel:#fff7e6;--panel2:#fffdf8;--line:#e0d2b2;--ink:#2b2118;--dim:#8a7a5f;--accent:#ff5a5f;--accent2:#f0a316;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--radius:13px;background-image:radial-gradient(#e2d5b8 .9px,transparent .9px);background-size:20px 20px}
  body[data-skin="crayon"] button.tool,body[data-skin="crayon"] button.act,body[data-skin="crayon"] select,body[data-skin="crayon"] .width{border-width:2px;font-weight:700}
  body[data-skin="crayon"] button.tool.on{transform:rotate(-2.5deg)}
  body[data-skin="sketch"]{--bg:#e7e1d2;--panel:#fbf8f0;--panel2:#fbf8f0;--line:#cabfa6;--ink:#26241f;--dim:#8b8371;--accent:#e5484d;--accent2:#2d5bd7;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--radius:9px}
  body[data-skin="sketch"] button.tool,body[data-skin="sketch"] button.act,body[data-skin="sketch"] select{border-width:1.5px}
  body[data-skin="toy"]{--bg:#ffeaf3;--panel:#ff6ea9;--panel2:#f6f1ff;--line:#f0c4da;--ink:#38264d;--dim:#6b4f82;--accent:#22c3a6;--accent2:#ff9f43;--font:"Trebuchet MS","Segoe UI",system-ui,sans-serif;--radius:18px}
  body[data-skin="toy"] button.tool,body[data-skin="toy"] button.act{border-width:2px;box-shadow:0 3px 0 rgba(56,38,77,.16)}
  body[data-skin="toy"] .appnav .brand{color:#fff} body[data-skin="toy"] .appnav .tab{color:#ffe3ef}
  body[data-skin="toy"] button.tool.on{transform:rotate(-2deg)}
  body[data-skin="crayon"] .tool.on,body[data-skin="crayon"] .tab.on,body[data-skin="sketch"] .tool.on,body[data-skin="sketch"] .tab.on,body[data-skin="toy"] .tool.on,body[data-skin="toy"] .tab.on{color:var(--ink)}
</style>
</head>
<body>
  <nav class="appnav">
    <a class="brand" href="./"><b>🎁</b> nft<span>.gift</span></a>
    <div class="tabs" id="panelTabs"><!-- Front / Inside / Back panel tabs (Phase 1b) --></div>
  </nav>

  <div class="toolbar">
    <div class="group"><span class="lbl">Brush</span>
      <button class="tool on" data-tool="pen"         title="Pen — smooth solid ink">✒️</button>
      <button class="tool"    data-tool="pencil"      title="Pencil — thin & crisp">✏️</button>
      <button class="tool"    data-tool="shade"       title="Shading — soft, builds up">🖌️</button>
      <button class="tool"    data-tool="highlighter" title="Highlighter — wide, see-through">🟨</button>
      <button class="tool"    data-tool="spray"       title="Spray paint — speckled airbrush">💨</button>
      <button class="tool"    data-tool="fractal"     title="Fractal brush — draw a stroke, a plant grows! (drag to aim & size)">🌿</button>
      <button class="tool"    data-tool="eraser"      title="Eraser — paints the background back">🧽</button>
    </div>
    <div class="sep"></div>
    <div class="group"><span class="lbl">Plant</span>
      <select id="fracKind" title="Fractal species (for the 🌿 brush)">
        <option value="Fern">🌿 Fern</option><option value="Tree">🌳 Tree</option><option value="Vine">🌀 Vine</option>
        <option value="Coral">🪸 Coral</option><option value="Lightning">⚡ Bolt</option><option value="Bush">🌾 Bush</option>
        <option value="Mandelbrot">◉ Mandelbrot</option>
      </select>
      <select id="fracGrow" title="Time-lapse growth (for the 🌿 brush)">
        <option value="off">Grow: off</option><option value="once">Grow: once</option><option value="loop">Grow: loop ∞</option>
      </select>
    </div>
    <div class="sep"></div>
    <div class="group"><span class="lbl">Stamp</span>
      <button class="tool" data-tool="stamp" title="Stamp — click to place a shape">⭐</button>
      <select id="stampShape" title="Stamp shape"><option>★</option><option>●</option><option>♥</option><option>✦</option></select>
    </div>
    <div class="sep"></div>
    <div class="group"><span class="lbl">Shape</span>
      <button class="tool" data-tool="line" title="Line">╱</button>
      <button class="tool" data-tool="rect" title="Rectangle">▭</button>
      <button class="tool" data-tool="ellipse" title="Ellipse">◯</button>
    </div>
    <div class="sep"></div>
    <div class="group" style="position:relative">
      <button class="tool" id="wiggle" title="Wiggle — make strokes & stamps come alive" style="min-width:auto;padding:7px 9px">🌀</button>
      <button class="tool" id="twinkle" title="Twinkle — opacity shimmer, out-of-sync per mark (stacks with wiggle)" style="min-width:auto;padding:7px 9px">✨</button>
      <button class="tool" id="twiggle" title="Wiggle settings (twiggle)" style="min-width:auto;padding:7px 8px">⚙</button>
      <div class="tpanel" id="tpanel" hidden>
        <label>Amount <span class="v" id="wAmtV">7</span></label>
        <input type="range" id="wAmt" min="2" max="22" value="7">
        <label>Speed <span class="v" id="wSpdV">5</span></label>
        <input type="range" id="wSpd" min="1" max="10" value="5">
        <label class="chk"><input type="checkbox" id="wSmooth"> Smooth wobble <span class="v">(vs jumpy boil)</span></label>
        <label style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">✨ Twinkle speed <span class="v" id="tSpdV">5</span></label>
        <input type="range" id="tSpd" min="1" max="10" value="5">
      </div>
    </div>
    <div class="sep"></div>
    <div class="group"><span class="lbl">View</span>
      <button class="tool" data-tool="pan" title="Pan — drag to move the canvas">✋</button>
      <button class="tool" id="zOut" title="Zoom out">🔍−</button>
      <button class="tool" id="zFit" title="Reset zoom (fit)" style="min-width:auto;padding:7px 8px;font:12px ui-monospace,Menlo,monospace"><span id="zlabel">100%</span></button>
      <button class="tool" id="zIn" title="Zoom in">🔍+</button>
    </div>
    <div class="sep"></div>
    <div class="group" id="widths"><span class="lbl">Size</span></div>
    <div class="sep"></div>
    <div class="group"><span class="lbl">Colour</span>
      <input type="color" id="nativeColor" value="#8b7cf6" title="Pick any colour — hue, saturation, brightness">
      <input id="hex" type="text" spellcheck="false" maxlength="7" aria-label="Hex colour" title="Type a hex colour">
    </div>
    <div class="group" id="palette"></div>
    <div class="sep"></div>
    <div class="group">
      <button class="tool" id="undo" title="Undo last stroke">↶</button>
      <button class="tool" id="redo" title="Redo">↷</button>
    </div>
    <div class="stat">
      <span>marks <b><span id="stN">0</span>/<span id="stCap">50</span></b><span id="stSeal" class="seal"></span></span> ·
      <span class="price">buy §<b id="stPrice">0</b></span>
    </div>
  </div>

  <div class="stage">
    <div class="frame">
      <svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 1000">
        <defs><filter id="mcyc"><feColorMatrix type="hueRotate" values="0"><animate attributeName="values" values="0;360" dur="10s" repeatCount="indefinite" calcMode="linear"></animate></feColorMatrix></filter><filter id="sprayBoil" x="-15%" y="-15%" width="130%" height="130%"><feTurbulence type="turbulence" baseFrequency="0.09" numOctaves="1" seed="1" result="n"><animate attributeName="seed" values="1;2;3" dur="0.5s" repeatCount="indefinite" calcMode="discrete"></animate></feTurbulence><feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"></feDisplacementMap></filter></defs>
        <rect id="bg" x="0" y="0" width="750" height="1000"></rect>
        <g id="committed"></g>
        <g id="active"></g>
        <g id="brushCursor" pointer-events="none" opacity="0">
          <circle id="bc1" r="3" fill="none" stroke="#000" stroke-width="1.6"></circle>
          <circle id="bc2" r="3" fill="none" stroke="#fff" stroke-width="0.8"></circle>
        </g>
      </svg>
      <div class="hint" id="hint">draw → “Add mark” to commit · scroll or 🔍 to zoom · ✋ to pan · work auto-saves</div>
    </div>
  </div>

  <div class="drawer" id="drawer"><pre id="svgview"></pre></div>

  <footer>
    <button class="act primary" id="commit">＋ Add mark</button>
    <button class="act" id="clearSess">Clear session</button>
    <button class="act" id="newCanvas" title="Start a fresh canvas (clears everything)">🗑 New</button>
    <div class="ledger" id="ledger"></div>
    <div class="spacer"></div>
    <select id="skin" title="App look / skin">
      <option value="crayon">Skin: Crayon</option>
      <option value="sketch">Skin: Sketchbook</option>
      <option value="toy">Skin: Toy Box</option>
      <option value="studio">Skin: Studio</option>
    </select>
    <select id="theme" title="Canvas colour theme"></select>
    <button class="act" id="viewsvg">&lt;/&gt; SVG</button>
    <button class="act" id="exportSvg" title="Export an animated SVG — the mintable, self-animating atom">⬇ SVG</button>
    <select id="pngRes" title="PNG output resolution — small (800²) for a 1:1 cover, large for the HQ deliverable">
      <option value="800">800² · cover</option>
      <option value="1000">1000²</option>
      <option value="1500">1500²</option>
      <option value="2000">2000²</option>
      <option value="3000">3000² · ultra-HQ</option>
      <option value="4096">4096² · max</option>
    </select>
    <button class="act pay" id="pngExport" title="Export a PNG at the chosen resolution — cover or HQ deliverable">⬇ PNG</button>
  </footer>

<script>
(() => {
  const SVGNS="http://www.w3.org/2000/svg", $=id=>document.getElementById(id);
  const svg=$("canvas"), committed=$("committed"), active=$("active"), bg=$("bg"), ledger=$("ledger");
  const STORE="nftGift.card.v1", CW=750, CH=1000;   // 3:4 portrait card coordinate space
  const CAP=50, SLOT_FEE=1, HOLDER_FEE=1;
  const THEMES={
    Aurora:{bg:"#0b1020",colors:["#7df9ff","#b794f6","#f472b6","#fbbf24","#34d399","#f8fafc"]},
    Riso:{bg:"#f4efe6",colors:["#ff5470","#2d6cdf","#ffcf3f","#00a878","#1a1a1a","#8a5a44"]},
    "Ink&Wash":{bg:"#faf8f4",colors:["#141420","#3f4756","#8a94a6","#c53030","#2f6f57","#b08d57"]},
    Sodium:{bg:"#0a0a0a",colors:["#ff7a18","#ffd28f","#ff4d4d","#ffe9c7","#c65102","#ffffff"]},
  };
  const WIDTHS=[3,6,12,24];
  const BRUSH={ pen:{mult:1,op:1,cap:"round"}, pencil:{mult:.55,op:.92,cap:"round"}, shade:{mult:2.4,op:.22,cap:"round"}, highlighter:{mult:3.4,op:.38,cap:"square",blend:"multiply"} };
  const FREEHAND=new Set(["pen","pencil","shade","highlighter","eraser"]);
  const STAR=(()=>{ let d=""; for(let i=0;i<10;i++){ const r=i%2?0.42:1, a=Math.PI*i/5-Math.PI/2; d+=(i?"L":"M")+(r*Math.cos(a)).toFixed(3)+" "+(r*Math.sin(a)).toFixed(3)+" "; } return d+"Z"; })();
  const SPARK="M0 -1 L0.25 -0.25 L1 0 L0.25 0.25 L0 1 L-0.25 0.25 L-1 0 L-0.25 -0.25 Z";
  const HEART="M0 -0.4 C0.55 -0.95 1.15 -0.1 0 0.75 C-1.15 -0.1 -0.55 -0.95 0 -0.4 Z";
  const STAMP={ "★":STAR, "✦":SPARK, "♥":HEART };

  let tool="pen", color="#8b7cf6", width=6, themeName="Aurora", wiggle=false, twinkle=false;
  let drawing=false, current=null, points=[], undone=[], nContrib=0;
  const WIG={amp:7, dur:"0.52s", calc:"discrete"};      // twiggle-able wiggle params
  const TWK={base:1.9};                                  // twinkle tempo centre (s); each mark still varies ±30% around it
  let zoom=1, panX=0, panY=0, panning=false, ps=null;   // zoom / pan
  const bgColor=()=>THEMES[themeName].bg;

  // ── Persistence ──
  const save=()=>{ try{ localStorage.setItem(STORE, JSON.stringify({ t:themeName, n:nContrib, c:committed.innerHTML, a:active.innerHTML })); }catch(_){} };
  const load=()=>{ try{ const s=JSON.parse(localStorage.getItem(STORE)); if(!s) return;
    if(s.t && THEMES[s.t]) themeName=s.t; committed.innerHTML=s.c||""; active.innerHTML=s.a||""; nContrib=s.n||0; rebuildLedger(); }catch(_){} };

  const toSvg=e=>{ const p=svg.createSVGPoint(); p.x=e.clientX; p.y=e.clientY; const q=p.matrixTransform(svg.getScreenCTM().inverse()); return {x:Math.round(q.x*10)/10, y:Math.round(q.y*10)/10}; };
  const smooth=pts=>{ if(!pts.length) return ""; if(pts.length<3) return `M ${pts[0].x} ${pts[0].y}`+pts.slice(1).map(p=>` L ${p.x} ${p.y}`).join("");
    let d=`M ${pts[0].x} ${pts[0].y}`; for(let i=1;i<pts.length-1;i++){ const mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2; d+=` Q ${pts[i].x} ${pts[i].y} ${mx} ${my}`; }
    const l=pts[pts.length-1]; return d+` L ${l.x} ${l.y}`; };
  const strokeAttrs=el=>{ const er=tool==="eraser", b=BRUSH[tool]||{mult:1,op:1,cap:"round"};
    el.setAttribute("fill","none"); el.setAttribute("stroke", er?bgColor():color); el.setAttribute("stroke-width", er?width*2:width*b.mult);
    el.setAttribute("stroke-linecap", b.cap||"round"); el.setAttribute("stroke-linejoin","round");
    if(!er && b.op<1) el.setAttribute("stroke-opacity",b.op); if(b.blend) el.setAttribute("style","mix-blend-mode:"+b.blend); };

  // ── Structured stroke record: params ride on each mark as data-rec, consolidated into <metadata> on export.
  //    The SVG renders anywhere; the params are for our own re-open / 3D-port / replay use (format nftsale.paint.v1). ──
  const setRec=(el,o)=>el.setAttribute("data-rec",JSON.stringify(o));
  const cpts=pts=>pts.map(p=>[Math.round(p.x*10)/10,Math.round(p.y*10)/10]);
  // seeded PRNG (mulberry32): spray scatter is reproducible from a stored seed → the atom re-renders identically forever
  const mulberry32=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  let sprayRng=Math.random;

  // ── Spray paint: scatter small dots within a radius each move (airbrush build-up), from a SEEDED rng ──
  const sprayAt=p=>{ const R=Math.max(6,width*2.4), n=Math.round(5+width/3), dr=Math.max(0.8,width*0.14);
    for(let i=0;i<n;i++){ const a=sprayRng()*6.2832, rr=Math.sqrt(sprayRng())*R, c=document.createElementNS(SVGNS,"circle");
      c.setAttribute("cx",(p.x+Math.cos(a)*rr).toFixed(1)); c.setAttribute("cy",(p.y+Math.sin(a)*rr).toFixed(1)); c.setAttribute("r",dr.toFixed(2)); c.setAttribute("fill",color); current.appendChild(c); } };

  // ── Fractal brush: recursive L-system plant · species presets + optional time-lapse growth ──
  const FRACTALS={
    Fern:{spread:.26,sJit:.16,ratio:.76,rJit:.05,third:.55,bias:0,ang:.12,leaf:1.5,leafOn:true,depth:5,wF:.9},
    Tree:{spread:.48,sJit:.30,ratio:.70,rJit:.08,third:.30,bias:0,ang:.22,leaf:1.9,leafOn:true,depth:5,wF:1.2},
    Vine:{spread:.30,sJit:.14,ratio:.80,rJit:.05,third:.12,bias:.24,ang:.10,leaf:1.2,leafOn:true,depth:6,wF:.8},
    Coral:{spread:.42,sJit:.30,ratio:.73,rJit:.07,third:.85,bias:0,ang:.28,leaf:0,leafOn:false,depth:5,wF:1},
    Lightning:{spread:.28,sJit:.6,ratio:.74,rJit:.08,third:.03,bias:0,ang:.55,leaf:0,leafOn:false,depth:5,wF:.65},

  // ── Colour ──
  const nc=$("nativeColor"), hexIn=$("hex"), paletteEl=$("palette");
  const setColor=v=>{ color=v; nc.value=v; hexIn.value=v.toUpperCase(); paletteEl.querySelectorAll(".swatch").forEach(x=>x.classList.remove("on")); };
  nc.oninput=()=>setColor(nc.value);
  hexIn.onchange=()=>{ let v=hexIn.value.trim().replace(/^#?/,""); if(/^([0-9a-f]{6})$/i.test(v)) setColor("#"+v.toLowerCase()); else if(/^([0-9a-f]{3})$/i.test(v)) setColor("#"+[...v].map(c=>c+c).join("").toLowerCase()); else hexIn.value=color.toUpperCase(); };
  const buildPalette=()=>{ paletteEl.innerHTML="<span class='lbl'>Palette</span>";
    THEMES[themeName].colors.forEach(c=>{ const b=document.createElement("button"); b.className="swatch"; b.style.background=c; b.title=c; b.onclick=()=>{ setColor(c); b.classList.add("on"); }; paletteEl.appendChild(b); }); };

  // ── Widths / theme ──
  const widthsEl=$("widths");
  WIDTHS.forEach(w=>{ const b=document.createElement("button"); b.className="width"+(w===width?" on":""); b.title=w+"px";
    const d=document.createElement("i"); const s=Math.max(3,Math.min(20,w)); d.style.width=s+"px"; d.style.height=s+"px"; b.appendChild(d);
    b.onclick=()=>{ width=w; widthsEl.querySelectorAll(".width").forEach(x=>x.classList.remove("on")); b.classList.add("on"); }; widthsEl.appendChild(b); });
  const themeSel=$("theme");
  Object.keys(THEMES).forEach(n=>{ const o=document.createElement("option"); o.value=n; o.textContent="Theme: "+n; themeSel.appendChild(o); });
  themeSel.onchange=()=>{ themeName=themeSel.value; applyTheme(); save(); };
  const applyTheme=()=>{ bg.setAttribute("fill",bgColor()); themeSel.value=themeName; buildPalette(); };

  // ── App skin (whole-tool vibe; separate from the canvas colour theme) ──
  const SKINSTORE="createNftSale.skin", skinSel=$("skin");
  const applySkin=s=>{ document.body.dataset.skin=s; skinSel.value=s; };
  skinSel.onchange=()=>{ applySkin(skinSel.value); try{localStorage.setItem(SKINSTORE,skinSel.value);}catch(_){} };
  let savedSkin="crayon"; try{ savedSkin=localStorage.getItem(SKINSTORE)||"crayon"; }catch(_){}
  applySkin(savedSkin);

  // ── SVG source viewer ──
  let drawerOpen=false;
  $("viewsvg").onclick=()=>{ drawerOpen=!drawerOpen; $("drawer").classList.toggle("open",drawerOpen); renderSource(); };
  const renderSource=()=>{ if(!drawerOpen) return; const html=committed.innerHTML.trim()||"<!-- no committed marks yet -->"; const bytes=new Blob([html]).size;
    $("svgview").innerHTML=`<span class="g">&lt;!-- ${nContrib} mark atom(s) · ${bytes} bytes on-chain · rendered natively --&gt;</span>\n`+html.replace(/</g,"&lt;").replace(/&lt;g /g,'<span class="g">&lt;g </span>'); };

  // ── Ultra-HQ export (always the FULL canvas, ignoring zoom/pan) ──
  const rasterPNG=(SIZE,name)=>{ const H=SIZE, W=Math.round(SIZE*CW/CH); const clone=svg.cloneNode(true); clone.querySelector("#brushCursor")?.remove(); // SIZE = height; width follows the 3:4 card ratio
    clone.setAttribute("viewBox",`0 0 ${CW} ${CH}`); clone.setAttribute("width",W); clone.setAttribute("height",H);
    clone.setAttributeNS("http://www.w3.org/2000/xmlns/","xmlns:xlink","http://www.w3.org/1999/xlink"); // so xlink:href image frames rasterize, not blank
    const url=URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(clone)],{type:"image/svg+xml"})); const img=new Image();
    img.onload=()=>{ const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const cx=cv.getContext("2d"); cx.fillStyle=bgColor(); cx.fillRect(0,0,W,H); cx.drawImage(img,0,0,W,H); URL.revokeObjectURL(url);
      cv.toBlob(b=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); },"image/png"); };
    img.onerror=()=>{ alert("Export failed in this browser — try Chrome/Edge/Firefox."); URL.revokeObjectURL(url); }; img.src=url; };
  $("pngExport").onclick=()=>{ const S=Math.max(64,Math.min(4096,parseInt($("pngRes").value,10)||800)); rasterPNG(S,`card-${S}px.png`); }; // chosen height; width follows 3:4

  // ── Export a standalone ANIMATED SVG (vector + SMIL preserved: wiggle/grow/mandelbrot-cycle) — the mintable atom ──
  $("exportSvg").onclick=()=>{
    const clone=svg.cloneNode(true);                    // clone the live canvas (bg, defs, ALL art + SMIL)
    clone.querySelector("#brushCursor")?.remove();      // drop only the cursor UI — KEEP #active so in-progress art exports too ("what you see")
    clone.setAttribute("viewBox","0 0 750 1000"); clone.setAttribute("width","750"); clone.setAttribute("height","1000"); // full card frame, ignore zoom/pan
    clone.setAttributeNS("http://www.w3.org/2000/xmlns/","xmlns:xlink","http://www.w3.org/1999/xlink"); // guarantee the xlink decl for image frames
    // consolidate every mark's structured params into ONE <metadata> block (nftsale.paint.v1) for our re-open/3D/replay use,
    // then strip the inline data-rec so the rendered SVG stays clean. Params live once; the SVG still renders anywhere.
    const recEls=[...clone.querySelectorAll("[data-rec]")];
    const strokes=recEls.map(el=>{ try{ return JSON.parse(el.getAttribute("data-rec")); }catch(_){ return null; } }).filter(Boolean);
    recEls.forEach(el=>el.removeAttribute("data-rec"));
    const md=document.createElementNS(SVGNS,"metadata"); md.setAttribute("id","nftsale-paint");
    md.textContent=JSON.stringify({format:"nftsale.paint.v1",w:750,h:1000,bg:bgColor(),strokes});
    clone.insertBefore(md, clone.firstChild);
    const doc='<?xml version="1.0" encoding="UTF-8"?>\n'+new XMLSerializer().serializeToString(clone); // proper XML = valid standalone SVG
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([doc],{type:"image/svg+xml"})); a.download="card.svg"; a.click(); };

  const refresh=()=>{ $("stN").textContent=nContrib; $("stCap").textContent=CAP; $("stPrice").textContent=nContrib*SLOT_FEE+HOLDER_FEE;
    $("undo").disabled=!active.children.length; $("redo").disabled=!undone.length;
    const sealed=nContrib>=CAP; $("commit").disabled=sealed||!active.children.length; $("stSeal").textContent=sealed?" · SEALED ✔":""; if(sealed) $("commit").textContent="● Sealed"; renderSource(); };

  load(); applyTheme(); setColor(color); applyView(); refresh();
})();
</script>
</body>
</html>
